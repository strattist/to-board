<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #15141b;
    color: #edecee;
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Blurred cover art backdrop */
  .backdrop {
    position: absolute;
    inset: -20px;
    background:
      linear-gradient(135deg,
        #0c2a44 0%,
        #1a4a6e 20%,
        #0d3a5c 35%,
        #1e5a7e 50%,
        #2a3a5e 65%,
        #1a2e4e 80%,
        #3a4a2e 100%
      );
    filter: blur(40px) brightness(0.38);
    transform: scale(1.1);
  }

  /* Vignette overlay */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(21,20,27,0.55) 100%);
    pointer-events: none;
  }

  /* Exit button */
  .exit-btn {
    position: absolute;
    top: 24px;
    right: 24px;
    z-index: 10;
    background: rgba(30,28,39,0.6);
    border: 1px solid #29263c;
    border-radius: 8px;
    color: #6d6d6d;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 150ms, border-color 150ms;
    font-size: 18px;
    line-height: 1;
  }
  .exit-btn:hover { color: #edecee; border-color: #6d6d6d; }

  /* Center layout */
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  /* Panel */
  .panel {
    background: rgba(21, 20, 27, 0.78);
    border: 1px solid #3d375e;
    border-radius: 20px;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    box-shadow:
      0 0 48px rgba(162,119,255,0.18),
      0 0 120px rgba(162,119,255,0.10),
      0 8px 64px rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    max-width: 480px;
    width: 90%;
  }

  /* QR code */
  .qr-wrap {
    background: #edecee;
    border-radius: 12px;
    padding: 12px;
    width: 280px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .qr-svg {
    width: 256px;
    height: 256px;
  }

  /* Game title */
  .game-title {
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #edecee;
    text-align: center;
    line-height: 1.1;
  }

  /* URL row */
  .url-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  .room-url {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: #6d6d6d;
    letter-spacing: 0.02em;
  }

  .copy-btn {
    background: transparent;
    border: 1px solid #29263c;
    border-radius: 8px;
    color: #6d6d6d;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    cursor: pointer;
    transition: color 150ms, border-color 150ms;
  }
  .copy-btn:hover { color: #edecee; border-color: #6d6d6d; }
