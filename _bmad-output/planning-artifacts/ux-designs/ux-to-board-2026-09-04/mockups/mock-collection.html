<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>to-board — Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #15141b;
    --surface:      #1e1c27;
    --surface-raised: #29263c;
    --fg:           #edecee;
    --fg-muted:     #6d6d6d;
    --primary:      #a277ff;
    --primary-dim:  #3d375e;
    --success:      #61ffca;
    --success-dim:  rgba(97,255,202,0.12);
    --warning:      #ffca85;
    --warning-dim:  rgba(255,202,133,0.12);
    --error:        #ff6767;
    --error-dim:    rgba(255,103,103,0.12);
    --border:       #29263c;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 0;
    height: 100vh;
  }

  .sidebar-wordmark {
    padding: 24px 20px 20px;
    font-size: 18px;
    font-weight: 600;
    color: var(--primary);
    letter-spacing: -0.01em;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-nav {
    flex: 1;
    padding: 12px 0;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 0;
    color: var(--fg-muted);
    font-size: 14px;
    font-weight: 500;
    transition: background 150ms, color 150ms;
  }

  .nav-item:hover { background: var(--surface-raised); color: var(--fg); }

  .nav-item.active {
    background: var(--surface-raised);
    color: var(--primary);
  }

  .nav-item svg { flex-shrink: 0; }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
  }

  .sidebar-toggle {
    background: none;
    border: none;
    color: var(--fg-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Main ── */
  .main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .main-header {
    padding: 28px 32px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .main-header h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .btn-primary {
    background: var(--primary);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    padding: 24px 32px 48px;
  }

  /* ── Game Card ── */
  .card {
    position: relative;
    aspect-ratio: 2/3;
    border-radius: 20px;
    overflow: hidden;
    background: var(--surface);
    cursor: pointer;
    transition: transform 200ms;
  }

  .card:hover { transform: scale(1.03); }

  .card-cover {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    letter-spacing: -0.03em;
    user-select: none;
  }

  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(21,20,27,0.95) 0%, rgba(21,20,27,0.4) 40%, transparent 65%);
    opacity: 0;
    transition: opacity 200ms;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 12px;
    gap: 6px;
  }

  .card:hover .card-overlay { opacity: 1; }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 500;
    width: fit-content;
  }

  .badge-always { opacity: 1 !important; }

  /* Badge on card — always visible */
  .card .badge {
    position: absolute;
    bottom: 10px;
    left: 10px;
    z-index: 2;
  }

  .badge-success { background: var(--success-dim); color: var(--success); }
  .badge-warning { background: var(--warning-dim); color: var(--warning); }
  .badge-error   { background: var(--error-dim);   color: var(--error); }
  .badge-muted   { background: transparent; color: var(--fg-muted); border: 1px solid var(--border); }

  /* Card title only on hover — position above badge */
  .card .card-title {
    position: absolute;
    bottom: 34px;
    left: 10px;
    right: 10px;
    z-index: 2;
  }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 10px; height: 10px;
    border: 1.5px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-wordmark">to-board</div>
  <nav class="sidebar-nav">
    <div class="nav-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="10" rx="1"/><rect x="14" y="3" width="7" height="6" rx="1"/>
        <rect x="14" y="13" width="7" height="8" rx="1"/><rect x="3" y="17" width="7" height="4" rx="1"/>
      </svg>
      Collection
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      Session Log
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>
      </svg>
      Settings
    </div>
  </nav>
  <div class="sidebar-footer">
    <button class="sidebar-toggle" title="Collapse sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
  </div>
</aside>

<!-- Main content -->
<main class="main">
  <div class="main-header">
    <h1>My Collection</h1>
    <button class="btn-primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add game
    </button>
  </div>

  <div class="grid">

    <!-- Wingspan — Ready to play -->
    <div class="card">
      <div class="card-cover" style="background: linear-gradient(135deg,#1a3a5c,#2d6a8c,#1a4a6e);">WS</div>
      <div class="card-overlay">
        <div class="card-title">Wingspan</div>
      </div>
      <span class="badge badge-success">Ready to play</span>
    </div>

    <!-- Catan — Ready to play -->
    <div class="card">
      <div class="card-cover" style="background: linear-gradient(135deg,#5c3a1a,#8c6a2d,#6e4a1a);">CT</div>
      <div class="card-overlay">
        <div class="card-title">Catan</div>
      </div>
      <span class="badge badge-success">Ready to play</span>
    </div>

    <!-- Azul — Ready to play -->
    <div class="card">
      <div class="card-cover" style="background: linear-gradient(135deg,#1a2e5c,#2d4a8c,#1e3a7a);">AZ</div>
      <div class="card-overlay">
        <div class="card-title">Azul</div>
      </div>
      <span class="badge badge-success">Ready to play</span>
    </div>

    <!-- Ticket to Ride — Needs review -->
    <div class="card">
      <div class="card-cover" style="background: linear-gradient(135deg,#4a1a1a,#8c2d2d,#6e2020);">TR</div>
      <div class="card-overlay">
        <div class="card-title">Ticket to Ride</div>
      </div>
      <span class="badge badge-warning">Needs review</span>
    </div>

    <!-- Pandemic — Needs review -->
    <div class="card">
      <div class="card-cover" style="background: linear-gradient(135deg,#1a3a1a,#2d6a3a,#1e4e2a);">PD</div>
      <div class="card-overlay">
        <div class="card-title">Pandemic</div>
      </div>
      <span class="badge badge-warning">Needs review</span>
    </div>

    <!-- Terraforming Mars — Generating -->
    <div class="card">
      <div class="card-cover" style="background: linear-gradient(135deg,#3a1a0a,#6e3a1a,#5c2e12);">TM</div>
      <div class="card-overlay">
        <div class="card-title">Terraforming Mars</div>
      </div>
      <span class="badge badge-muted"><span class="spinner"></span> Generating…</span>
    </div>

    <!-- 7 Wonders — No content yet -->
    <div class="card">
      <div class="card-cover" style="background: linear-gradient(135deg,#2a2a1a,#4e4e2a,#3a3a1e);">7W</div>
      <div class="card-overlay">
        <div class="card-title">7 Wonders</div>
      </div>
      <span class="badge badge-muted">No content yet</span>
    </div>

    <!-- Codenames — Rejected -->
    <div class="card">
      <div class="card-cover" style="background: linear-gradient(135deg,#1a1a3a,#2e2e6e,#22225c);">CD</div>
      <div class="card-overlay">
        <div class="card-title">Codenames</div>
      </div>
      <span class="badge badge-error">Rejected</span>
    </div>

    <!-- Root — Rejected -->
    <div class="card">
      <div class="card-cover" style="background: linear-gradient(135deg,#2a1a0a,#5c3a18,#3e2810);">RT</div>
      <div class="card-overlay">
        <div class="card-title">Root</div>
      </div>
      <span class="badge badge-error">Rejected</span>
    </div>

  </div>
</main>

</body>
</html>
