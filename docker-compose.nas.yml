# Image-only stack for the NAS (Dockge / Portainer). No build: images come from GHCR.
# Required in .env next to this file: SECRET_KEY, AUTHENTIK_ISSUER, APP_BASE_URL,
# TO_BOARD_DB_DATASET, TO_BOARD_UPLOADS_DATASET. Optional: TO_BOARD_VERSION (pin / rollback),
# TO_BOARD_HTTP_PORT (host port, default 8080 because TrueNAS itself uses 80/443).
# APP_BASE_URL must include the port, e.g. http://192.168.1.10:8080
services:
  api:
    image: ghcr.io/strattist/to-board-api:${TO_BOARD_VERSION:-latest}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      DB_PATH: /data/db/to-board.db
      UPLOADS_PATH: /data/uploads
      SECRET_KEY: ${SECRET_KEY}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      AUTH_DISABLED: "false"
      APP_BASE_URL: ${APP_BASE_URL}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.0-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    volumes:
      - type: bind
        source: ${TO_BOARD_DB_DATASET}
        target: /data/db
      - type: bind
        source: ${TO_BOARD_UPLOADS_DATASET}
        target: /data/uploads
  web:
    image: ghcr.io/strattist/to-board-web:${TO_BOARD_VERSION:-latest}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports: ["${TO_BOARD_HTTP_PORT:-8080}:80"]
    depends_on: [api]
  watchtower:
    image: nickfedor/watchtower:1.23.0
    restart: unless-stopped
    command: --label-enable --cleanup --interval 3600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR PAT (read:packages), created by `docker login ghcr.io` on the NAS.
      - ${DOCKER_CONFIG_FILE:-/root/.docker/config.json}:/config.json:ro
